<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=1920, height=1080">
<title>Óra és időjárás</title>
<style>
  /* ====== BEÁLLÍTÁSOK a script elején (CONFIG) ====== */
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  body{font-family:"Roboto","Segoe UI",Arial,sans-serif;color:#fff}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
    display:grid;grid-template-columns:900px 1fr;gap:60px;padding:70px 100px;box-sizing:border-box}
  .dim{color:#8a8a8a}
  .label{letter-spacing:.18em;text-transform:uppercase;color:#9a9a9a;font-size:22px}
  /* óra */
  #clock{font-size:250px;font-weight:200;line-height:1;letter-spacing:-6px;margin-top:150px;display:flex;align-items:flex-start}
  #clock .colon{color:#666;margin:0 4px;animation:blink 2s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  #sec{font-size:48px;color:#777;margin-left:18px;margin-top:24px;letter-spacing:0;font-weight:300}
  #date{font-size:44px;color:#a8a8a8;font-weight:300;margin-top:30px}
  /* időjárás */
  #wx{margin-top:70px}
  #wxnow{display:flex;align-items:center;gap:30px;margin-top:18px}
  #wxnow svg{width:110px;height:110px}
  #temp{font-size:96px;font-weight:300}
  #wxdesc{font-size:30px;line-height:1.45}
  #wxdesc .dim{font-size:26px}
  #days{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:40px;border-top:1px solid #222;padding-top:22px;text-align:center}
  #days .d{font-size:26px;color:#aaa}
  #days svg{width:62px;height:62px;margin:10px 0}
  #days .t{font-size:28px}
  #days .p{font-size:21px;color:#5aa9e6;height:26px}
  /* jobb oldal */
  #right{padding-top:40px}
  .sect-h{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
  .sect-h .sub{font-size:26px;color:#ddd}
  .nd{display:grid;grid-template-columns:150px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid #1d1d1d}
  .nd .k{font-size:24px;color:#999;letter-spacing:.12em}
  .nd .v{font-size:40px}
  .nd .v .o{font-size:26px;color:#888}
  .nd.tm .v{font-size:30px;color:#ccc}
  #hol{margin-top:36px}
  .hl{display:grid;grid-template-columns:24px 1fr auto;align-items:baseline;padding:9px 0;border-bottom:1px solid #1a1a1a}
  .hl .dot{width:11px;height:11px;border-radius:50%;background:#f5a623;transform:translateY(-3px)}
  .hl .n{font-size:28px}
  .hl .n .dt{font-size:22px;color:#888;margin-left:10px}
  .hl .c{font-size:26px;color:#5aa9e6}
  #music{margin-top:50px}
  #mrow{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start;margin-top:8px}
  #playerbox{width:400px;height:225px;background:#111;border-radius:6px;overflow:hidden;position:relative}
  #playerbox iframe{width:400px;height:225px;border:0}
  #mtitle{font-size:30px;line-height:1.25;max-height:128px;overflow:hidden}
  #martist{font-size:26px;color:#999;margin-top:8px}
  #mbar{height:5px;background:#222;border-radius:3px;margin-top:28px;overflow:hidden}
  #mbar div{height:100%;width:0;background:#5aa9e6}
  #mtime{display:flex;justify-content:space-between;font-size:20px;color:#777;margin-top:8px;font-variant-numeric:tabular-nums}
  #mstate{font-size:24px;color:#bbb;margin-top:22px}
  #mhint{font-size:19px;color:#555;margin-top:10px;line-height:1.5}
  #status{position:absolute;right:30px;bottom:18px;font-size:16px;color:#444}
</style>
</head>
<body>
<div id="stage">
  <div id="left">
    <div id="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span id="sec">--</span></div>
    <div id="date"></div>
    <div id="wx">
      <div class="label" id="city"></div>
      <div id="wxnow"><span id="wxicon"></span><span id="temp">–°</span><div id="wxdesc"></div></div>
      <div id="days"></div>
    </div>
  </div>
  <div id="right">
    <div id="names">
      <div class="sect-h"><span class="label">NÉVNAP</span></div>
      <div class="nd"><span class="k">MA</span><span class="v" id="ndtoday"></span></div>
      <div class="nd tm"><span class="k">HOLNAP</span><span class="v" id="ndtomorrow"></span></div>
    </div>
    <div id="hol">
      <div class="sect-h"><span class="label">ÜNNEPEK</span></div>
      <div id="holidays"></div>
    </div>
    <div id="music">
      <div class="sect-h"><span class="label">ZENE</span><span class="sub" id="mlist">YouTube Music</span></div>
      <div id="mrow">
        <div id="playerbox"><div id="ytplayer"></div></div>
        <div>
          <div id="mtitle">Nincs beállítva lejátszási lista</div>
          <div id="martist"></div>
          <div id="mbar"><div id="mprog"></div></div>
          <div id="mtime"><span id="mcur">0:00</span><span id="mdur">0:00</span></div>
          <div id="mstate"></div>
          <div id="mhint">OK: lejátszás / szünet · ► következő · ◄ előző</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="status"></div>

<script>
/* =================== BEÁLLÍTÁSOK =================== */
var CONFIG = {
  city: "Kecskemét",
  lat: 46.9062, lon: 19.6913,
  // YouTube Music lejátszási lista azonosítója (a link "list=" utáni része)
  playlistId: "RDTMAK5uy_nzfwl2UYv7htL7wDoxbX8Pp6UAFBd92cQ",
  playlistName: "YouTube Music mix",
  shuffle: true,
  // Saját fontos dátumok (hónap-nap): pl. születésnapok. A listában az ünnepek között jelennek meg.
  myDates: [
    // { date: "11-19", name: "Példa – születésnap" },
  ]
};
/* =================================================== */

var HU_DAYS = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
var HU_DAYS_SHORT = ["V","H","K","Sze","Cs","P","Szo"];
var HU_MONTHS = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
var HU_MON_SHORT = ["jan.","febr.","márc.","ápr.","máj.","jún.","júl.","aug.","szept.","okt.","nov.","dec."];
function pad(n){return (n<10?"0":"")+n}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---- méretezés: bármilyen felbontáson kitölti a képet ---- */
function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  var st=$("stage");st.style.transform="scale("+s+")";
  st.style.left=((window.innerWidth-1920*s)/2)+"px";st.style.top=((window.innerHeight-1080*s)/2)+"px";}
window.addEventListener("resize",fit);fit();

/* ---- óra ---- */
function tick(){var d=new Date();
  $("hh").textContent=pad(d.getHours());$("mm").textContent=pad(d.getMinutes());$("sec").textContent=pad(d.getSeconds());
  $("date").textContent=d.getFullYear()+". "+HU_MONTHS[d.getMonth()]+" "+d.getDate()+"., "+HU_DAYS[d.getDay()];}
setInterval(tick,1000);tick();

function getJSON(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}

/* ---- ikonok ---- */
var ICON={
 sun:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="32" cy="32" r="11"/><g stroke-linecap="round"><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M15 49l5-5M44 20l5-5"/></g></svg>',
 part:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="24" cy="22" r="8"/><path stroke-linecap="round" d="M24 6v4M8 22h4M12.7 10.7l2.8 2.8M35.3 10.7l-2.8 2.8"/><path d="M22 50h26a9 9 0 0 0 0-18 13 13 0 0 0-25 3 7.5 7.5 0 0 0-1 15z" fill="#000"/></svg>',

 rain:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M18 40h30a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-3 17z"/><path stroke="#5aa9e6" stroke-linecap="round" d="M24 46l-3 8M33 46l-3 8M42 46l-3 8"/></svg>',
 snow:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M18 40h30a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-3 17z"/><g fill="#cfe8ff" stroke="none"><circle cx="23" cy="50" r="2.5"/><circle cx="33" cy="54" r="2.5"/><circle cx="43" cy="50" r="2.5"/></g></svg>',
 storm:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M18 40h30a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-3 17z"/><path d="M34 42l-6 9h7l-5 9" stroke="#f5c542" stroke-linejoin="round"/></svg>'
};
function wmo(c){ // Open-Meteo WMO kód -> [ikon, leírás]
 if(c===0)return["sun","Derült"]; if(c===1)return["part","Túlnyomóan derült"]; if(c===2)return["part","Részben felhős"];
 if(c===3)return["cloud","Borult"]; if(c===45||c===48)return["fog","Köd"];
 if(c>=51&&c<=57)return["rain","Szitálás"]; if(c>=61&&c<=67)return["rain","Eső"]; if(c>=80&&c<=82)return["rain","Zápor"];
 if((c>=71&&c<=77)||c===85||c===86)return["snow","Havazás"]; if(c>=95)return["storm","Zivatar"]; return["cloud","–"];}

/* ---- időjárás (Open-Meteo, kulcs nélkül) ---- */
function loadWeather(){
 var u="https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.lat+"&longitude="+CONFIG.lon+
  "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code"+
  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset"+
  "&timezone=Europe%2FBudapest&forecast_days=6";
 return getJSON(u).then(function(j){
  var c=j.current,w=wmo(c.weather_code);
  $("city").textContent=CONFIG.city.toUpperCase();
  $("wxicon").innerHTML=ICON[w[0]];
  $("temp").textContent=Math.round(c.temperature_2m)+"°";
  var sunset=(j.daily.sunset[0]||"").slice(11,16);
  $("wxdesc").innerHTML=w[1]+'<br><span class="dim">Hőérzet '+Math.round(c.apparent_temperature)+'° · Szél '+Math.round(c.wind_speed_10m)+
   ' km/h</span><br><span class="dim">Pára '+c.relative_humidity_2m+'% · Napnyugta '+sunset+'</span>';
  var h="";
  for(var i=1;i<=5;i++){var dt=new Date(j.daily.time[i]+"T12:00:00"),dw=wmo(j.daily.weather_code[i]),p=j.daily.precipitation_probability_max[i];
   h+='<div><div class="d">'+HU_DAYS_SHORT[dt.getDay()]+'</div>'+ICON[dw[0]]+'<div class="t">'+Math.round(j.daily.temperature_2m_max[i])+
     '° <span class="dim">'+Math.round(j.daily.temperature_2m_min[i])+'°</span></div><div class="p">'+(p>=30?p+"%":"")+'</div></div>';}
  $("days").innerHTML=h;
 });
}

function namesOn(d){var y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
 var leap=new Date(y,1,29).getMonth()===1;
 if(m===1&&leap){if(day===24)return[];if(day>24)day--;} // szökőnap: febr. 24. névtelen, utána eltolódik
 return ND[m][day-1]||[];}
function namesHtml(a){if(!a.length)return '<span class="o">–</span>';
 return esc(a[0])+(a.length>1?'<span class="o">, '+esc(a.slice(1,4).join(", "))+'</span>':'');}

/* ---- ünnepek ---- */
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
 h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
 return new Date(y,mo-1,dy);}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function holidaysOf(y){var e=easter(y),L=[
 [new Date(y,0,1),"Újév"],[new Date(y,2,15),"Nemzeti ünnep"],[addD(e,-2),"Nagypéntek"],[e,"Húsvét"],[addD(e,1),"Húsvéthétfő"],
 [new Date(y,4,1),"A munka ünnepe"],[addD(e,49),"Pünkösd"],[addD(e,50),"Pünkösdhétfő"],[new Date(y,7,20),"Államalapítás ünnepe"],
 [new Date(y,9,23),"Nemzeti ünnep"],[new Date(y,10,1),"Mindenszentek"],[new Date(y,11,24),"Szenteste"],
 [new Date(y,11,25),"Karácsony"],[new Date(y,11,26),"Karácsony másnapja"]];
 // anyák napja: május első vasárnapja (nem munkaszüneti nap)
 var md=new Date(y,4,1);while(md.getDay()!==0)md=addD(md,1);L.push([md,"Anyák napja",1]);
 (CONFIG.myDates||[]).forEach(function(x){var p=x.date.split("-");L.push([new Date(y,+p[0]-1,+p[1]),x.name,2]);});
 return L;}
function loadNames(){
 var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 $("ndtoday").innerHTML=namesHtml(namesOn(today));
 $("ndtomorrow").innerHTML=namesHtml(namesOn(addD(today,1)));
 var all=holidaysOf(today.getFullYear()).concat(holidaysOf(today.getFullYear()+1))
  .filter(function(h){return h[0]>=today;}).sort(function(a,b){return a[0]-b[0];});
 // egymást követő napokat (pl. karácsony) egy sorba vonjuk
 var rows=[];all.forEach(function(h){var last=rows[rows.length-1];
  if(last&&!h[2]&&!last.t&&(h[0]-last.end)===864e5&&rows.length){last.end=h[0];last.names.push(h[1]);}
  else rows.push({start:h[0],end:h[0],names:[h[1]],t:h[2]});});
 $("holidays").innerHTML=rows.slice(0,3).map(function(r){
  var days=Math.round((r.start-today)/864e5);
  var dt=HU_MON_SHORT[r.start.getMonth()]+" "+r.start.getDate()+"."+(r.end>r.start?"–"+r.end.getDate()+".":"");
  var col=r.t===2?"#c38bff":r.t===1?"#4cd07d":"#f5a623";
  return '<div class="hl"><span class="dot" style="background:'+col+'"></span><span class="n">'+esc(r.names.indexOf("Karácsony")>-1?"Karácsony":r.names[0])+'<span class="dt">'+dt+'</span></span><span class="c">'+
   (days===0?"ma":days===1?"holnap":days+" nap múlva")+'</span></div>';}).join("");
}

/* ---- Zene: YouTube lejátszó a saját listával ---- */
var yt=null,ytReady=false,ytErr=0;
function fmt(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+pad(t%60);}
function initMusic(){
 if(!CONFIG.playlistId){$("mstate").textContent="Írd be a lista azonosítóját a CONFIG részbe.";return;}
 $("mlist").textContent=CONFIG.playlistName;
 $("mtitle").textContent="Betöltés…";
 var tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";
 tag.onerror=function(){$("mtitle").textContent="A YouTube lejátszó nem töltött be";};
 document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady=function(){
 yt=new YT.Player("ytplayer",{width:400,height:225,
  playerVars:{origin:location.origin,listType:"playlist",list:CONFIG.playlistId,autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1},
  events:{
   onReady:function(){ytReady=true;
    if(CONFIG.shuffle){yt.setShuffle(true);setTimeout(function(){yt.playVideoAt(0);},500);} else yt.playVideo();
    setTimeout(function(){if(yt.getPlayerState()!==1)$("mstate").textContent="Nyomd meg az OK gombot az indításhoz";},2500);},
   onStateChange:function(e){
    var st={"-1":"","0":"Vége","1":"▶ Szól","2":"❚❚ Szünet","3":"Töltés…","5":""}[e.data];
    $("mstate").textContent=st||"";
    if(e.data===1)ytErr=0;
    var d=yt.getVideoData&&yt.getVideoData();
    if(d&&d.title){$("mtitle").textContent=d.title;$("martist").textContent=(d.author||"").replace(/ - Topic$/,"");}},
   onError:function(ev){ytErr++;
    if(ev&&ev.data===153){$("mtitle").textContent="YouTube hiba 153";$("mstate").textContent="A böngésző letiltja a hivatkozót (pl. Brave pajzs)";return;}
    // nem beágyazható szám: ugrik; ha sorban sok hibás, a lista nem játszható
    var pl=yt.getPlaylist&&yt.getPlaylist();
    if(ytErr>=5||!pl||!pl.length){$("mtitle").textContent="Ez a lista beágyazva nem játszható le";
     $("mstate").textContent="Próbálj egy saját, nyilvános listát";return;}
    setTimeout(function(){yt.nextVideo();},1000);}
  }});
};
setInterval(function(){if(!ytReady)return;var c=yt.getCurrentTime(),d=yt.getDuration();
 $("mcur").textContent=fmt(c);$("mdur").textContent=fmt(d);$("mprog").style.width=(d?c/d*100:0)+"%";},1000);
document.addEventListener("keydown",function(e){if(!ytReady)return;var k=e.keyCode;
 if(k===13||k===23||k===179||k===32){yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo();e.preventDefault();}
 else if(k===39||k===176){yt.nextVideo();e.preventDefault();}
 else if(k===37||k===177){yt.previousVideo();e.preventDefault();}
});
// a fókusz maradjon az oldalon, ne a lejátszóban (távirányító gombok miatt)
setInterval(function(){if(document.activeElement&&document.activeElement.tagName==="IFRAME")document.activeElement.blur();},1000);

/* ---- frissítési ütemezés, hibatűrés ---- */
function safe(fn,name){return function(){fn().then(function(){$("status").textContent="";}).catch(function(e){$("status").textContent=name+" nem frissült ("+e.message+")";});};}
var w=safe(loadWeather,"Időjárás");
w();loadNames();initMusic();
setInterval(w,15*60e3);
setInterval(function(){var n=new Date();if(n.getHours()===0&&n.getMinutes()===0)loadNames();},60e3); // éjfélkor frissül
// 6 óránként teljes újratöltés – de zenélés közben nem
setInterval(function(){if(Date.now()-START>6*3600e3&&!(ytReady&&yt.getPlayerState()===1))location.reload();},60e3);
var START=Date.now();
